name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    # Tell Bing/Yandex about changed URLs via IndexNow once the deploy is live.
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Ping IndexNow
        env:
          INDEXNOW_KEY: cf64910e6308775a8b5155d128c773c7
        run: |
          set -e
          URLS_JSON=$(curl -sL --max-time 30 https://abewartech.github.io/portfoliobyastro/sitemap.xml | grep -oP '<loc>\K[^<]+' | jq -R . | jq -c -s .)
          COUNT=$(echo "$URLS_JSON" | jq 'length')
          echo "Pinging IndexNow with $COUNT URLs"
          PAYLOAD=$(jq -n --arg key "$INDEXNOW_KEY" --argjson urls "$URLS_JSON" '{host:"abewartech.github.io", key:$key, keyLocation:("https://abewartech.github.io/portfoliobyastro/"+$key+".txt"), urlList:$urls}')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$PAYLOAD")
          echo "IndexNow HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then exit 1; fi
